<div class="section container">
  <div class="section-head center" appReveal>
    <span class="eyebrow">Skills</span>
    <h2 class="section-title">My <span class="grad-text">tech universe</span></h2>
    <p class="section-sub">The tools I use to design, build, scale and ship. Drag the sphere to explore.</p>
  </div>

  <div class="bento">
    <div class="sphere-card fx-card" appScrollFx [fxEnd]="0.55">
      <div class="sphere-inner fx-unfold">
        <div class="sphere" #sphere role="img" aria-label="Interactive 3D cloud of my skills">
          <span class="core"></span>
          <span class="orbit o1"></span>
          <span class="orbit o2"></span>
          <span class="tag" #tag *ngFor="let t of tags" [style.--h]="t.hue">{{ t.label }}</span>
        </div>
        <p class="hint"><i class="fas fa-hand-pointer"></i> Drag to spin</p>
      </div>
    </div>

    <div
      class="cell g{{ i }}"
      *ngFor="let g of groups; let i = index"
      appScrollFx
      [fxEnd]="0.5"
      [fxDelay]="(i % 3) * 0.12"
    >
      <article class="group fx-card fx-flip" appSpotlight [style.--h]="g.hue">
        <header>
          <span class="g-icon"><i [class]="g.icon"></i></span>
          <h3>{{ g.title }}</h3>
          <span class="count">{{ g.items.length }}</span>
        </header>
        <ul class="tiles">
          <li class="tile" *ngFor="let t of g.tiles; let k = index" [style.--k]="k">
            <span class="t-icon">
              <app-tech-logo *ngIf="t.hasLogo; else faIcon" [name]="t.label" [size]="20"></app-tech-logo>
              <ng-template #faIcon>
                <i *ngIf="t.icon; else mono" [class]="t.icon"></i>
              </ng-template>
              <ng-template #mono
                ><b>{{ t.mono }}</b></ng-template
              >
            </span>
            <span class="t-label">{{ t.label }}</span>
          </li>
        </ul>
      </article>
    </div>
  </div>
</div>
