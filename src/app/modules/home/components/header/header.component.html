<header class="nav" [class.scrolled]="scrolled" [class.open]="menuOpen">
  <div class="progress" [style.transform]="'scaleX(' + progress + ')'"></div>

  <div class="container nav-inner">
    <a class="brand" href="#home" (click)="go('home', $event)" aria-label="Nitesh Kaushik — home">
      <span class="mark">NK</span>
      <span class="brand-text">
        <span class="brand-name">Nitesh <span class="grad-text">Kaushik</span></span>
        <span class="brand-role">{{ profile.title }}</span>
      </span>
    </a>

    <nav class="links" aria-label="Primary">
      <a
        *ngFor="let l of links"
        [href]="'#' + l.id"
        (click)="go(l.id, $event)"
        [class.active]="active === l.id"
        >{{ l.label }}</a
      >
    </nav>

    <div class="nav-cta">
      <a class="btn btn-primary resume-btn" [href]="profile.resume" download="Nitesh_Kaushik_Resume.pdf">
        <i class="fas fa-download"></i> Résumé
      </a>
      <button
        class="burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-menu"
        aria-label="Toggle menu"
      >
        <span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu">
    <a
      *ngFor="let l of links; let i = index"
      [href]="'#' + l.id"
      (click)="go(l.id, $event)"
      [class.active]="active === l.id"
      [style.transition-delay.ms]="menuOpen ? 60 + i * 40 : 0"
    >
      <span class="idx">0{{ i + 1 }}</span>{{ l.label }}
    </a>
    <a class="btn btn-primary" [href]="profile.resume" download="Nitesh_Kaushik_Resume.pdf">
      <i class="fas fa-download"></i> Download résumé
    </a>
  </div>
</header>
