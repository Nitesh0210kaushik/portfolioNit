<div class="section container">
  <div class="about-grid">
    <div class="portrait-wrap" appReveal>
      <div class="portrait" appTilt [tiltMax]="8">
        <div class="frame">
          <img [src]="profile.photo" alt="Portrait of Nitesh Kaushik" width="1181" height="1450" loading="lazy" />
          <div class="glare"></div>
        </div>
        <div class="badge badge-exp glass">
          <strong class="grad-text">3+</strong>
          <span>Years building<br />production apps</span>
        </div>
        <div class="badge badge-stack glass">
          <i class="fas fa-code"></i>
          <span>MERN · MEAN · React Native</span>
        </div>
      </div>
    </div>

    <div class="copy">
      <div appReveal>
        <span class="eyebrow">About me</span>
        <h2 class="section-title">
          An engineer who ships <span class="grad-text">end-to-end products</span>
        </h2>
      </div>

      <p class="para" *ngFor="let p of profile.about; let i = index" appReveal [revealDelay]="100 + i * 80">
        {{ p }}
      </p>

      <ul class="facts" appReveal [revealDelay]="260">
        <li *ngFor="let f of facts">
          <i [class]="f.icon"></i>
          <div>
            <span class="label">{{ f.label }}</span>
            <a *ngIf="f.href; else plain" [href]="f.href">{{ f.value }}</a>
            <ng-template #plain
              ><span class="value">{{ f.value }}</span></ng-template
            >
          </div>
        </li>
      </ul>
    </div>
  </div>

  <div class="focus">
    <div class="focus-cell" *ngFor="let f of focus; let i = index" appScrollFx [fxEnd]="0.55" [fxDelay]="i * 0.14">
      <article class="focus-card fx-card fx-unfold" appSpotlight>
        <span class="focus-num" aria-hidden="true">0{{ i + 1 }}</span>
        <span class="focus-icon"><i [class]="f.icon"></i></span>
        <h3>{{ f.title }}</h3>
        <p>{{ f.text }}</p>
      </article>
    </div>
  </div>
</div>
