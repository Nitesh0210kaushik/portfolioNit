<footer class="footer">
  <div class="container inner">
    <div class="brand">
      <span class="mark">NK</span>
      <div>
        <strong>{{ profile.name }}</strong>
        <span>{{ profile.title }} · {{ profile.location }}</span>
      </div>
    </div>

    <div class="socials">
      <a
        *ngFor="let s of profile.socials"
        class="icon-btn"
        [href]="s.url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="s.label"
      >
        <i [class]="s.icon"></i>
      </a>
      <button class="icon-btn" (click)="toTop()" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    </div>
  </div>
  <div class="container bottom">
    <span>© {{ year }} {{ profile.name }}. All rights reserved.</span>
    <span>Designed &amp; built with Angular and Three.js</span>
  </div>
</footer>
