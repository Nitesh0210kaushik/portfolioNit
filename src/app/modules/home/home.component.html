<app-header></app-header>

<main>
  <app-hero></app-hero>

  <div class="ticker" aria-label="Technologies I work with">
    <p class="ticker-label"><span></span>The stack I ship with<span></span></p>
    <div class="lane" *ngFor="let l of lanes; let li = index" [class.reverse]="li % 2 === 1">
      <div class="track">
        <ng-container *ngFor="let copy of [0, 1]">
          <span class="pill" *ngFor="let t of l" [style.--c]="t.color" [attr.aria-hidden]="copy === 1 ? 'true' : null">
            <span class="pill-logo"><app-tech-logo [name]="t.label" [size]="20"></app-tech-logo></span>
            {{ t.label }}
          </span>
        </ng-container>
      </div>
    </div>
  </div>

  <section id="about"><app-about></app-about></section>
  <section id="services"><app-services></app-services></section>
  <section id="integrations"><app-integrations></app-integrations></section>
  <section id="experience"><app-experience></app-experience></section>
  <section id="work"><app-projects></app-projects></section>
  <section id="skills"><app-skills></app-skills></section>
  <section id="education"><app-education></app-education></section>
  <section id="contact"><app-contact></app-contact></section>
</main>

<app-footer></app-footer>
